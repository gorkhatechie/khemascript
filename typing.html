<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Typing Test</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom styles for the keyboard */
        body {
            font-family: 'Inter', sans-serif;
        }
        .key {
            /* Base key style */
            background-color: #4b5563; /* gray-600 */
            border-bottom: 4px solid #374151; /* gray-700 */
            transition: all 0.07s ease;
            padding: 1rem;
        }
        .key.active {
            /* Style when key is pressed */
            background-color: #3b82f6; /* blue-500 */
            border-bottom-color: #2563eb; /* blue-600 */
            transform: translateY(2px);
            box-shadow: 0 0 10px #3b82f6;
        }
        /* Widths for special keys */
        .key-backspace { width: 8rem; } /* w-32 */
        .key-tab { width: 5rem; } /* w-20 */
        .key-caps { width: 7.5rem; } /* w-26 */
        .key-enter { width: 8rem; } /* w-32 */
        .key-shift { width: 9rem; } /* w-36 */
        .key-space { flex-grow: 1; } /* Fills remaining space */

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            .key {
                padding: 0.5rem 0.25rem;
                margin: 0.125rem;
                font-size: 0.75rem; /* Smaller text */
            }
            /* Adjust special key widths for mobile */
            .key-backspace { width: 5rem; }
            .key-tab { width: 3rem; }
            .key-caps { width: 4rem; }
            .key-enter { width: 5rem; }
            .key-shift { width: 4.5rem; }
        }
    </style>

    <link rel="stylesheet" href="style.css">
    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-5xl flex flex-col items-center">
        <h1 class="text-4xl font-bold mb-6 text-blue-300">Simple Typing Test</h1>

        <!-- Output Display -->
        <p class="text-gray-400 mb-2">Your typed text will appear here:</p>
        <div id="output-display" class="w-full max-w-4xl min-h-[120px] bg-gray-800 border-2 border-gray-600 rounded-lg p-4 text-xl font-mono mb-8 shadow-inner overflow-auto"></div>

        <!-- Keyboard -->
        <div id="keyboard-container" class="w-full max-w-5xl p-2 bg-gray-800 rounded-lg shadow-xl">
            <!-- Row 1 -->
            <div class="row flex justify-center mb-1 w-full">
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Backquote">\`</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit1">1 <span class="eng">1</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit2">2 <span class="eng">2</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit3">3 <span class="eng">3</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit4">4 <span class="eng">4</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit5">5 <span class="eng">5</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit6">6 <span class="eng">6</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit7">7 <span class="eng">7</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit8">8 <span class="eng">8</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit9">9 <span class="eng">9</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="Digit0">0 <span class="eng">0</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Minus">-</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Equal">=</div>
                <div class="key key-backspace rounded-md p-3 m-1 text-center font-medium" data-key="Backspace">Backspace</div>
            </div>
            <!-- Row 2 -->
            <div class="row flex justify-center mb-1 w-full">
                <div class="key key-tab rounded-md p-3 m-1 text-center font-medium" data-key="Tab">Tab</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyQ">q <span class="eng">q</span></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyW">w</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyE">e</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyR">r</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyT">t</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyY">y</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyU">u</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyI">i</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyO">o</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium khema" data-key="KeyP">p</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="BracketLeft">[</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="BracketRight">]</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Backslash">\</div>
            </div>
            <!-- Row 3 -->
            <div class="row flex justify-center mb-1 w-full">
                <div class="key key-caps rounded-md p-3 m-1 text-center font-medium" data-key="CapsLock">Caps Lock</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyA">A</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyS">S</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyD">D</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyF">F</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyG">G</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyH">H</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyJ">J</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyK">K</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyL">L</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Semicolon">;</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Quote">'</div>
                <div class="key key-enter rounded-md p-3 m-1 text-center font-medium" data-key="Enter">Enter</div>
            </div>
            <!-- Row 4 -->
            <div class="row flex justify-center mb-1 w-full">
                <div class="key key-shift rounded-md p-3 m-1 text-center font-medium" data-key="ShiftLeft">Shift</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyZ">Z</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyX">X</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyC">C</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyV">V</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyB">B</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyN">N</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="KeyM">M</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Comma">,</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Period">.</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="Slash">/</div>
                <div class="key key-shift rounded-md p-3 m-1 text-center font-medium" data-key="ShiftRight">Shift</div>
            </div>
            <!-- Row 5 -->
            <div class="row flex justify-center w-full">
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="ControlLeft">Ctrl</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="AltLeft">Alt</div>
                <div class="key key-space rounded-md p-3 m-1 text-center font-medium" data-key="Space"></div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="AltRight">Alt</div>
                <div class="key rounded-md p-3 m-1 text-center font-medium" data-key="ControlRight">Ctrl</div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const outputDisplay = document.getElementById('output-display');
            const keys = document.querySelectorAll('.key');

            // Create a map for quick lookup of keys by their 'data-key' (which corresponds to event.code)
            const keyMap = new Map();
            keys.forEach(key => {
                keyMap.set(key.dataset.key, key);
            });

            // Handle key down event
            window.addEventListener('keydown', (e) => {
                // Prevent default browser behavior for keys like Tab or Space (scrolling)
                e.preventDefault();

                const keyElement = keyMap.get(e.code);
                let char = e.key;

                // 1. Highlight the pressed key
                if (keyElement) {
                    keyElement.classList.add('active');
                }

                // 2. Update the output display
                if (char.length === 1) {
                    // Normal character keys (a, b, 1, 2, $, %, etc.)
                    outputDisplay.textContent += char;
                } else if (e.code === 'Backspace') {
                    // Handle Backspace
                    outputDisplay.textContent = outputDisplay.textContent.slice(0, -1);
                } else if (e.code === 'Space') {
                    // Handle Space
                    outputDisplay.textContent += ' ';
                } else if (e.code === 'Enter') {
                    // Handle Enter
                    outputDisplay.textContent += '\n';
                } else if (e.code === 'Tab') {
                    // Handle Tab (insert 4 spaces)
                    outputDisplay.textContent += '    ';
                }

                // Auto-scroll to the bottom of the output display
                outputDisplay.scrollTop = outputDisplay.scrollHeight;
            });

            // Handle key up event
            window.addEventListener('keyup', (e) => {
                const keyElement = keyMap.get(e.code);

                // Remove the 'active' class to un-highlight the key
                if (keyElement) {
                    keyElement.classList.remove('active');
                }
            });

            // --- NEW: Add click/touch listeners to virtual keys ---
            keys.forEach(key => {
                // Use 'mousedown' and 'mouseup' to better simulate key press/release
                // and 'touchstart'/'touchend' for mobile

                const handlePress = (e) => {
                    e.preventDefault(); // Prevent focus shift on click
                    const code = key.dataset.key;
                    let char; // Map 'code' to the character or action

                    // Manual mapping based on the existing HTML
                    // This determines what character to print or action to take
                    switch(code) {
                        case 'Backspace': char = 'Backspace'; break;
                        case 'Tab': char = 'Tab'; break;
                        case 'Enter': char = 'Enter'; break;
                        case 'Space': char = ' '; break; // 'key' is " " for space
                        case 'KeyQ': char = 'q'; break;
                        case 'KeyW': char = 'w'; break;
                        case 'KeyE': char = 'e'; break;
                        case 'KeyR': char = 'r'; break;
                        case 'KeyT': char = 't'; break;
                        case 'KeyY': char = 'y'; break;
                        case 'KeyU': char = 'u'; break;
                        case 'KeyI': char = 'i'; break;
                        case 'KeyO': char = 'o'; break;
                        case 'KeyP': char = 'p'; break;
                        case 'KeyA': char = 'a'; break;
                        case 'KeyS': char = 's'; break;
                        case 'KeyD': char = 'd'; break;
                        case 'KeyF': char = 'f'; break;
                        case 'KeyG': char = 'g'; break;
                        case 'KeyH': char = 'h'; break;
                        case 'KeyJ': char = 'j'; break;
                        case 'KeyK': char = 'k'; break;
                        case 'KeyL': char = 'l'; break;
                        case 'KeyZ': char = 'z'; break;
                        case 'KeyX': char = 'x'; break;
                        case 'KeyC': char = 'c'; break;
                        case 'KeyV': char = 'v'; break;
                        case 'KeyB': char = 'b'; break;
                        case 'KeyN': char = 'n'; break;
                        case 'KeyM': char = 'm'; break;
                        case 'Digit1': char = '1'; break;
                        case 'Digit2': char = '2'; break;
                        case 'Digit3': char = '3'; break;
                        case 'Digit4': char = '4'; break;
                        case 'Digit5': char = '5'; break;
                        case 'Digit6': char = '6'; break;
                        case 'Digit7': char = '7'; break;
                        case 'Digit8': char = '8'; break;
                        case 'Digit9': char = '9'; break;
                        case 'Digit0': char = '0'; break;
                        case 'Backquote': char = '`'; break;
                        case 'Minus': char = '-'; break;
                        case 'Equal': char = '='; break;
                        case 'BracketLeft': char = '['; break;
                        case 'BracketRight': char = ']'; break;
                        case 'Backslash': char = '\\'; break;
                        case 'Semicolon': char = ';'; break;
                        case 'Quote': char = '\''; break;
                        case 'Comma': char = ','; break;
                        case 'Period': char = '.'; break;
                        case 'Slash': char = '/'; break;

                        // Keys that do nothing on click (for this simple app)
                        case 'CapsLock':
                        case 'ShiftLeft':
                        case 'ShiftRight':
                        case 'ControlLeft':
                        case 'ControlRight':
                        case 'AltLeft':
                        case 'AltRight':
                            char = 'Functional'; // A placeholder for non-printing keys
                            break;
                        default:
                            char = 'Functional'; // Fallback for any other keys
                    }

                    // 1. Simulate visual press
                    key.classList.add('active');

                    // 2. Update the output display (re-using logic from keydown)
                    if (char.length === 1) {
                        outputDisplay.textContent += char;
                    } else if (code === 'Backspace') {
                        outputDisplay.textContent = outputDisplay.textContent.slice(0, -1);
                    } else if (code === 'Space') {
                        // 'char' is ' ' but we check 'code' for clarity
                        outputDisplay.textContent += ' ';
                    } else if (code === 'Enter') {
                        outputDisplay.textContent += '\n';
                    } else if (code === 'Tab') {
                        outputDisplay.textContent += '    ';
                    }

                    // Auto-scroll to the bottom
                    outputDisplay.scrollTop = outputDisplay.scrollHeight;
                };

                const handleRelease = () => {
                    // Remove visual press
                    key.classList.remove('active');
                };

                // Add listeners for mouse and touch
                key.addEventListener('mousedown', handlePress);
                key.addEventListener('mouseup', handleRelease);
                key.addEventListener('mouseleave', handleRelease); // In case mouse slides off

                key.addEventListener('touchstart', handlePress, { passive: false });
                key.addEventListener('touchend', handleRelease);
            });

            // Focus the window to start capturing keys immediately
            window.focus();
            // Optional: Click anywhere to focus
            document.body.addEventListener('click', () => {
                window.focus();
            });
        });
    </script>

</body>
</html>
